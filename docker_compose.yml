version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: company_db
    ports:
      - "3306:3306"
    networks:
      - two_tier_app

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      

  web:
    build: .
    image: simple-flask-app-web:latest
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DB: company_db
    
    depends_on:
      db:
        condition: service_healthy

    networks:
      - two_tier_app

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


networks:
  two_tier_app:
    driver: bridge

